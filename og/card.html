<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Josh.Menu OG card</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    :root {
      --ground: #080b0a;
      --bone: #f4f1ea;
      --accent: #10d592;
      --muted: #9aaba4;
      --display: "Syne", system-ui, sans-serif;
      --body: "Instrument Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #050706;
      color: var(--bone);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(16, 213, 146, 0.26) 0%, rgba(16, 213, 146, 0.08) 28%, transparent 58%),
        radial-gradient(ellipse 55% 40% at 0% 100%, rgba(16, 213, 146, 0.1), transparent 55%),
        radial-gradient(ellipse 45% 35% at 100% 0%, rgba(16, 213, 146, 0.12), transparent 50%),
        linear-gradient(180deg, #0b100e 0%, #050706 100%);
    }
    /* faint grid — craft, not noise */
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.045;
      background-image:
        linear-gradient(rgba(244, 241, 234, 0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 241, 234, 0.8) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 75%);
    }
    .frame {
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(244, 241, 234, 0.18);
      border-radius: 6px;
      pointer-events: none;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(16, 213, 146, 0.22);
      border-radius: 3px;
    }
    /* corner ticks */
    .frame::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 6px;
      background:
        linear-gradient(var(--accent), var(--accent)) left top / 28px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left top / 2px 28px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 28px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 2px 28px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 28px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 2px 28px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 28px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 2px 28px no-repeat;
      opacity: 0.85;
    }
    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 80px 68px;
      text-align: center;
    }
    .mark-halo {
      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 1.65rem;
    }
    .mark-halo::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 213, 146, 0.35) 0%, rgba(16, 213, 146, 0.08) 40%, transparent 68%);
      filter: blur(2px);
    }
    .mark {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.02em;
      width: 176px;
      height: 176px;
      background:
        linear-gradient(160deg, rgba(16, 213, 146, 0.22) 0%, transparent 48%),
        linear-gradient(180deg, #0d1411 0%, #050807 100%);
      border: 2.5px solid rgba(244, 241, 234, 0.95);
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(16, 213, 146, 0.45),
        0 0 0 10px rgba(16, 213, 146, 0.06),
        0 0 80px rgba(16, 213, 146, 0.35),
        0 30px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -3px 0 rgba(0, 0, 0, 0.45);
      font-family: var(--display);
      font-weight: 800;
      font-size: 96px;
      line-height: 1;
      letter-spacing: -0.07em;
    }
    .mark__j {
      color: #1dffaa;
      text-shadow:
        0 0 18px rgba(16, 213, 146, 0.95),
        0 0 40px rgba(16, 213, 146, 0.55),
        0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .mark__m {
      color: var(--bone);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    .wordmark {
      font-family: var(--display);
      font-weight: 800;
      font-size: 76px;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.15rem;
    }
    .wordmark span { color: var(--accent); }
    .rule {
      width: 72px;
      height: 2px;
      margin: 1.15rem auto 1.05rem;
      background: linear-gradient(90deg, transparent, #1dffaa, transparent);
      box-shadow: 0 0 12px rgba(16, 213, 146, 0.55);
      border-radius: 2px;
    }
    .tag {
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: rgba(244, 241, 234, 0.78);
      max-width: 30ch;
    }
    .url {
      position: absolute;
      left: 58px;
      bottom: 50px;
      z-index: 2;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(244, 241, 234, 0.42);
    }
    .chip {
      position: absolute;
      right: 58px;
      bottom: 50px;
      z-index: 2;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(16, 213, 146, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>
    <div class="inner">
      <div class="mark-halo">
        <div class="mark" aria-hidden="true">
          <span class="mark__j">J</span><span class="mark__m">M</span>
        </div>
      </div>
      <h1 class="wordmark">Josh<span>.</span>Menu</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tag">Custom websites — every pixel, one person</p>
    </div>
    <p class="url">josh.menu</p>
    <p class="chip">Studio</p>
  </div>
</body>
</html>
