<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Josh.Menu OG card</title>
  <link rel="stylesheet" href="../fonts.css">
  <style>
    :root {
      --ground: #080b0a;
      --bone: #f4f1ea;
      --accent: #10d592;
      --muted: #9aaba4;
      --display: "Syne", system-ui, sans-serif;
      --body: "Instrument Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ground);
      color: var(--bone);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 60% 55% at 50% 40%, rgba(16, 213, 146, 0.12), transparent 60%),
        var(--ground);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px;
      text-align: center;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      margin-bottom: 1.75rem;
      background: #080b0a;
      border: 2px solid rgba(244, 241, 234, 0.92);
      border-radius: 14px;
      font-family: var(--display);
      font-weight: 800;
      font-size: 62px;
      letter-spacing: -0.04em;
      line-height: 1;
      overflow: hidden;
    }
    .mark__j { color: var(--accent); }
    .mark__m { color: var(--bone); }
    .wordmark {
      font-family: var(--display);
      font-weight: 800;
      font-size: 68px;
      letter-spacing: -0.045em;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .wordmark span { color: var(--accent); }
    .tag {
      font-size: 26px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .url {
      position: absolute;
      bottom: 48px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(244, 241, 234, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <span class="mark__j">J</span><span class="mark__m">M</span>
    </div>
    <h1 class="wordmark">Josh<span>.</span>Menu</h1>
    <p class="tag">Custom websites for small businesses</p>
    <p class="url">josh.menu</p>
  </div>
</body>
</html>
