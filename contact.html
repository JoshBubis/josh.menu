<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-light" aria-hidden="true"></div>

    <header class="site-header">
        <a class="wordmark" href="/">Josh<span class="wordmark__dot">.</span>Menu</a>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary">
            <a href="/#samples">Samples</a>
            <a href="/#work">Work</a>
            <a href="/#faq">FAQ</a>
            <a href="/#about">About</a>
            <a href="/contact.html" class="nav-cta" aria-current="page">Start a project</a>
        </nav>
    </header>

    <main id="main" class="contact-page">
        <section class="contact-form-section">
            <p class="eyebrow">Contact</p>
            <h1 class="contact-page-title">Start a project</h1>
            <p class="contact-lead">Tell me what you’re building, your timeline, and any examples you like. I’ll
                reply from <a href="mailto:josh@josh.menu">josh@josh.menu</a> with scope and next steps.</p>

            <div id="contact-alert" class="contact-alert" hidden></div>

            <form id="contact-form" class="contact-form" method="post"
                action="https://api.josh.menu/webhooks/contact" novalidate>
                <input type="hidden" name="return_to" value="https://josh.menu">
                <input type="hidden" name="form_started_at" id="form_started_at" value="">
                <input type="hidden" name="cf_turnstile_response" id="cf-turnstile-response" value="">

                <div class="hp" aria-hidden="true">
                    <label>Company <input type="text" name="company" tabindex="-1" autocomplete="off"></label>
                    <label>Website <input type="text" name="website_url" tabindex="-1" autocomplete="off"></label>
                </div>

                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" required maxlength="120" autocomplete="name">
                </label>

                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" required maxlength="200" autocomplete="email">
                </label>

                <label class="field">
                    <span>Subject <em>(optional)</em></span>
                    <input type="text" name="subject" maxlength="200" placeholder="Website project inquiry">
                </label>

                <label class="field">
                    <span>Message</span>
                    <textarea name="message" required maxlength="5000" rows="7"
                        placeholder="What you need, timeline, examples…"></textarea>
                </label>

                <div id="turnstile-wrap" class="turnstile-wrap">
                    <div id="turnstile-container"></div>
                    <p id="turnstile-status" class="muted small">Loading bot check…</p>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Send message</button>
            </form>

            <p class="contact-alt">Prefer email? <a
                    href="mailto:josh@josh.menu?subject=Website%20project%20inquiry">josh@josh.menu</a></p>

            <div class="social-links">
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>© <span id="year"></span> <span class="jm-name">Josh.Menu</span></span>
        <div class="footer-links">
            <a href="mailto:josh@josh.menu">josh@josh.menu</a>
        </div>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="script.js?v=jm9"></script>
    <script src="contact.js?v=jm2"></script>
    <script src="chat.js?v=jm4" defer></script>
</body>

</html>
